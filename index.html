<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Language Translation Tool — CodeAlpha</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

  <div class="masthead">
    <p class="kicker">Task 1 — Language Translation Tool</p>
    <h1>Translate text instantly</h1>
    <p>Type or paste text, choose a source and target language, and get a translation right away.</p>
  </div>

  <div class="card">
    <div class="lang-bar">
      <div class="lang-select-wrap">
        <label for="sourceLang">From</label>
        <select id="sourceLang">
          <option value="auto">Detect language</option>
          {% for code, name in languages %}
          <option value="{{ code }}" {% if code == 'en' %}selected{% endif %}>{{ name }}</option>
          {% endfor %}
        </select>
      </div>
      <button class="swap-btn" id="swapBtn" title="Swap languages" aria-label="Swap languages">⇄</button>
      <div class="lang-select-wrap">
        <label for="targetLang">To</label>
        <select id="targetLang">
          {% for code, name in languages %}
          <option value="{{ code }}" {% if code == 'ar' %}selected{% endif %}>{{ name }}</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <div class="panes">
      <div class="pane source">
        <textarea id="sourceText" placeholder="Enter text to translate..." maxlength="1000"></textarea>
        <div class="pane-foot">
          <span class="char-count"><span id="charCount">0</span> / 1000</span>
          <div class="tools">
            <button class="icon-btn" id="listenSource" title="Listen to source text" aria-label="Listen to source text">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>
            </button>
            <button class="icon-btn" id="clearSource" title="Clear" aria-label="Clear text">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>
            </button>
          </div>
        </div>
      </div>
      <div class="pane target">
        <div id="output" class="empty">Translation will appear here...</div>
        <div class="pane-foot">
          <span class="status" id="statusMsg"></span>
          <div class="tools">
            <button class="icon-btn" id="listenOutput" title="Listen to translation" aria-label="Listen to translation">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>
            </button>
            <button class="icon-btn" id="copyOutput" title="Copy translation" aria-label="Copy translation">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="action-row">
      <button class="translate-btn" id="translateBtn">Translate</button>
    </div>
  </div>

  <footer>CodeAlpha · Artificial Intelligence Internship · Task 1</footer>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
